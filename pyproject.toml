[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "rag-roadmap"
version = "0.1.0"
description = "Automatic cyber roadmap builder (CPE/CVE/CWE/CAPEC/ATT&CK/D3FEND)."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "requests",
  "beautifulsoup4",
  "sentence-transformers",
  "numpy",
  "keybert",
  "spacy",
  "dash",
  "dash-cytoscape",
]

[project.scripts]
gvrm = "rag_roadmap.cli:main"
vvrm = "rag_roadmap.Visualize:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
